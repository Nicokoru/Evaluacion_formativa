<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Mi primer Sitio</title>
    <link rel="icon" href="../img/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/calculadora.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
    <header class="py-3 text-center bg-light">
        <img src="../img/logo2.png" alt="Logo de mi sitio" width="80" height="80">
        <h1 class="h2 mt-2">Calculadora</h1>
        <p class="lead mb-0">Realiza operaciones básicas con dos números</p>
    </header>

    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid justify-content-center">
            <ul class="navbar-nav flex-row flex-wrap gap-3">
                <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="acercade.html">Acerca de</a></li>
                <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                <li class="nav-item"><a class="nav-link" href="ejemploJS.html">JS</a></li>
                <li class="nav-item"><a class="nav-link active" href="calculadora.html">Calculadora</a></li>
                <li class="nav-item"><a class="nav-link" href="localstorage.html">LocalStorage</a></li>
                <li class="nav-item"><a class="nav-link" href="json.html">JSON</a></li>
                <li class="nav-item"><a class="nav-link" href="sheets.html">Google Sheet</a></li>
            </ul>
        </div>
    </nav>

    <main class="body-calculadora">
        <form class="calculadora" onsubmit="event.preventDefault();">
            <h1>Calculadora</h1>
            <input type="number" id="num1" placeholder="Ingrese el primer número">
            <input type="number" id="num2" placeholder="Ingrese el segundo número">

            <button type="button" onclick="sumar()">Sumar</button>
            <button type="button" onclick="restar()">Restar</button>
            <button type="button" onclick="multiplicar()">Multiplicar</button>
            <button type="button" onclick="dividir()">Dividir</button>
            <button type="button" onclick="limpiar()">Limpiar</button>

            <p id="resultado">Resultado: </p>
        </form>
    </main>

    <footer class="py-3 bg-dark text-white text-center">
        <p class="mb-0">Todos los derechos reservados &copy; 2026</p>
        <p class="mb-0">Nico Ruiz</p>
    </footer>

    <script src="../js/funciones.js"></script>
</body>
</html>
