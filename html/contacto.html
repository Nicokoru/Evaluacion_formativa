<!DOCTYPE html>
<html lang="es"> 
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Contacto - Mi primer Sitio</title>
        <link rel="icon" href="../img/logo.svg">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<body>
    <header class="py-3 text-center bg-light">
         <img src="../img/logo2.png" alt="Logo de mi sitio" width="80" height="80">
        <h1 class="h2 mt-2">Bienvenido a mi sitio web</h1>
    </header>
<nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container-fluid justify-content-center">
        <ul class="navbar-nav flex-row gap-3">
            <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="acercade.html">Acerca de</a></li>
            <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
            <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        </ul>
    </div>
</nav>
<main class="container my-5 bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
        <h2 class="mb-4 text-center">Formulario de Contacto</h2>
        <form>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ej: Nico Ruiz" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu consulta aquí..." required></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Enviar Consulta</button>
        </form>
    </main>

    <footer class="py-3 bg-dark text-white text-center">
        <p class="mb-0">Todos los derechos reservados &copy; 2026</p>
        <p class="mb-0">Nico Ruiz</p>
    </footer>
</body>
</html>
